<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis finanzas</title>
<meta name="theme-color" content="#1f6f5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#f3f4f1;--card:#ffffff;--card2:#f7f8f5;--ink:#17201c;--muted:#68706b;--line:#e3e6e1;
  --acc:#17775f;--acc2:#0f5a47;--acc-soft:#e1f1eb;--red:#c2412f;--red-soft:#fbe8e4;--amb:#b07200;--amb-soft:#fdf1d8;--ok:#17775f;
  --r:20px;--shadow:0 1px 2px rgba(16,24,20,.05),0 4px 16px rgba(16,24,20,.06);
  --nav-h:68px;
}
@media (prefers-color-scheme:dark){:root{--bg:#0f1211;--card:#181c1a;--card2:#1f2421;--ink:#eef0ec;--muted:#98a09b;--line:#2a302d;--acc:#4cc59f;--acc2:#2f9e7d;--acc-soft:#173029;--red:#f07f6e;--red-soft:#361f1b;--amb:#f0b450;--amb-soft:#33281a;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.num,.mono{font-variant-numeric:tabular-nums;font-weight:650}
.wrap{max-width:640px;margin:0 auto;padding:0 16px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom))}

/* top app bar */
.appbar{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:calc(12px + env(safe-area-inset-top)) 16px 10px;margin:0 -16px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.appbar h1{font-size:24px;margin:0;letter-spacing:-.02em;font-weight:750}
.monthpill{display:inline-flex;align-items:center;gap:2px;margin-top:4px;background:var(--card);border-radius:99px;padding:2px;box-shadow:var(--shadow);border:1px solid var(--line)}
.monthpill span{min-width:118px;text-align:center;font-size:13.5px;font-weight:600;text-transform:capitalize}
.monthpill button{border:none;background:none;width:30px;height:30px;padding:0;border-radius:50%;color:var(--muted);font-size:18px}
.iconbtn{border:none;background:var(--card);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink);box-shadow:var(--shadow);border:1px solid var(--line);padding:0}
.iconbtn.on{background:var(--acc-soft);color:var(--acc)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* bottom nav */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);align-items:end;max-width:100%}
.bottomnav button{border:none;background:none;padding:4px 0 2px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11.5px;font-weight:600;border-radius:0}
.bottomnav button .ic{width:56px;height:30px;border-radius:99px;display:grid;place-items:center;transition:background .2s}
.bottomnav button.on{color:var(--ink)}
.bottomnav button.on .ic{background:var(--acc-soft);color:var(--acc)}
.bottomnav .add{position:relative}
.bottomnav .add .plus{width:58px;height:58px;border-radius:20px;margin-top:-26px;background:linear-gradient(145deg,var(--acc),var(--acc2));color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px color-mix(in srgb,var(--acc) 45%,transparent)}
.bottomnav .add .plus svg{width:28px;height:28px;stroke-width:2.4}

/* controls */
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 14px;transition:transform .08s,background .2s}
button:active{transform:scale(.96)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){button.pri,.bottomnav .add .plus{color:#06231b}}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 8px}
button.small{padding:6px 12px;font-size:13.5px;border-radius:99px;font-weight:600}
button.soft{background:var(--acc-soft);border-color:transparent;color:var(--acc)}
button:disabled{opacity:.5;cursor:default}
input,select{font:inherit;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:500}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));align-items:end}

/* surfaces */
#view{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:16px;margin:0 0 10px;font-weight:700;letter-spacing:-.01em}
.grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 14px;box-shadow:var(--shadow)}
.stat .l{font-size:12.5px;color:var(--muted);font-weight:500}
.stat .v{font-size:19px;margin-top:3px;letter-spacing:-.01em}
.hero{border-radius:24px;padding:20px;margin-bottom:14px;color:#fff;position:relative;overflow:hidden}
.hero.ok{background:linear-gradient(140deg,#1b8a6d,#0f5a47)}
.hero.warn{background:linear-gradient(140deg,#c98712,#8f5a00)}
.hero.bad{background:linear-gradient(140deg,#d24c38,#93291b)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .t{font-size:13.5px;opacity:.85;font-weight:500}
.hero .big{font-size:36px;margin:4px 0 8px;letter-spacing:-.02em;font-weight:750}
.hero p{margin:8px 0 0;opacity:.95}
.meter{height:8px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.meter i{display:block;height:100%;background:#fff;border-radius:99px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:none}
.row .d{color:var(--muted);font-size:12.5px}
.bar{height:8px;background:var(--acc);border-radius:99px}
.catrow{display:grid;grid-template-columns:118px 1fr 96px;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.catrow .bwrap{background:var(--line);border-radius:99px;height:8px}
.muted{color:var(--muted)}.small{font-size:12.5px}
.red{color:var(--red)}.amb{color:var(--amb)}.okc{color:var(--ok)}
.pill{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--line);color:var(--muted);font-weight:600;white-space:nowrap}
.pill.red{background:var(--red-soft);color:var(--red)}.pill.okp{background:var(--acc-soft);color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 6px;border-top:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:12px;border-top:none}
td.r,th.r{text-align:right}
.tip{background:var(--card2);border-radius:14px;padding:11px 13px;margin-top:10px;font-size:14px}
.status{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 22px + env(safe-area-inset-bottom));z-index:9;background:var(--ink);color:var(--bg);
  font-size:13px;font-weight:600;padding:9px 14px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
.status.show{opacity:1}

/* sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:8;display:flex;align-items:flex-end;justify-content:center;animation:fadebg .2s}
@keyframes fadebg{from{background:rgba(0,0,0,0)}}
.sheet .panel{background:var(--card);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .25s cubic-bezier(.2,.8,.2,1)}
.sheet .panel::before{content:"";display:block;width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 12px}
@keyframes up{from{transform:translateY(100%)}}
.amount{font-size:40px;font-weight:750;text-align:center;border:none!important;background:transparent!important;padding:4px 0;outline:none!important;letter-spacing:-.02em}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:4px 0 8px;background:var(--card2);padding:4px;border-radius:14px}
.seg button{border:none;background:none;border-radius:11px;font-weight:600}
.seg button.on{background:var(--card);box-shadow:var(--shadow);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 12px}
.chips button{border-radius:99px;padding:7px 13px;font-size:14px;background:var(--card2)}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:10;padding:20px}
.lock .box{max-width:320px;width:100%;text-align:center}
.lock input{font-size:26px;text-align:center;letter-spacing:.4em;margin:14px 0}
.hide{display:none!important}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.btnlike{display:inline-block;position:relative;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px}
svg text{fill:var(--muted);font:11px system-ui,sans-serif}
@media (min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="appbar">
    <div>
      <h1 id="pageTitle">Inicio</h1>
      <div class="monthpill" id="monthPill">
        <button id="prevM" aria-label="Mes anterior">‹</button>
        <span id="mLabel"></span>
        <button id="nextM" aria-label="Mes siguiente">›</button>
      </div>
    </div>
    <button class="iconbtn" id="gear" aria-label="Ajustes" data-t="ajustes"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <main id="view"></main>
</div>
<div class="status" id="status" role="status" aria-live="polite"></div>
<nav class="bottomnav" id="tabs" aria-label="Menú">
  <button data-t="resumen" class="on"><span class="ic"><svg class="i" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/></svg></span>Inicio</button>
  <button data-t="movs"><span class="ic"><svg class="i" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg></span>Movimientos</button>
  <button class="add" id="fab" aria-label="Anotar gasto o ingreso"><span class="plus"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>Anotar</button>
  <button data-t="deudas"><span class="ic"><svg class="i" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6.5 15h4"/></svg></span>Deudas</button>
  <button data-t="plan"><span class="ic"><svg class="i" viewBox="0 0 24 24"><path d="M3 20h18"/><path d="M6 16l4-5 3 3 5-7"/><path d="M14 7h4v4"/></svg></span>Plan</button>
</nav>
<div class="lock hide" id="lock">
  <form class="box" id="lockForm">
    <h1>Mis finanzas</h1>
    <p class="muted">Escribe tu PIN</p>
    <input id="pinIn" type="password" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="PIN">
    <button class="pri" style="width:100%" type="submit">Entrar</button>
    <p class="small red" id="lockMsg"></p>
  </form>
</div>

<script>
(function(){
"use strict";
// ---------- helpers ----------
const $ = s => document.querySelector(s);
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "style") e.setAttribute("style", v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()){ if (c == null || c === false) continue; e.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  return e;
}
const fmt = n => (n < 0 ? "−" : "") + "$" + Math.round(Math.abs(n)).toLocaleString("es-CO");
const num = v => { if (typeof v === "number") return v; const s = String(v||"").replace(/[^\d,.-]/g,"").replace(/\./g,"").replace(",","."); const n = parseFloat(s); return isFinite(n) ? n : 0; };
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const mKey = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
const mName = k => { const [y,m] = k.split("-"); return MESES[+m-1] + " " + y; };
const addM = (k, n) => { const [y,m] = k.split("-").map(Number); return mKey(new Date(y, m-1+n, 1)); };
const uid = () => Math.random().toString(36).slice(2,10);
const CATS = ["Mercado","Transporte","Comida fuera / domicilios","Suscripciones","Salud","Ropa y personal","Entretenimiento","Hogar","Regalos","Otros","Fijo","Pago deuda","Ahorro","Salario","Ingreso extra"];
const NO_VAR = new Set(["Fijo","Pago deuda","Ahorro"]);

// ---------- state ----------
const EMPTY = {ingreso:0, ahorroPct:0, tasaSupuesta:26, extraDeuda:0, fijos:[], deudas:[]};
let config = null;         // loaded config
const movs = {};           // monthKey -> array
let cur = mKey(new Date());
let tab = "resumen";
// ---------- persistence: everything stays on this phone (localStorage), encrypted when a PIN is set ----------
const K_PLAIN = "finanzas:datos", K_ENC = "finanzas:cifrado";
let pinKey = null, pinSalt = null, saveTimer = null, saveChain = Promise.resolve();
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pin, salt){
  const base = await crypto.subtle.importKey("raw", enc.encode(pin), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:200000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
const snapshot = () => JSON.stringify({v:1, config, movs});
async function writeNow(){
  const json = snapshot();
  if (pinKey){
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, pinKey, enc.encode(json));
    localStorage.setItem(K_ENC, JSON.stringify({salt:b64(pinSalt), iv:b64(iv), ct:b64(ct)}));
    localStorage.removeItem(K_PLAIN);
  } else {
    localStorage.setItem(K_PLAIN, json);
    localStorage.removeItem(K_ENC);
  }
}
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    saveChain = saveChain.then(writeNow).catch(() => setStatus("No se pudo guardar. ¿El celular está sin espacio?"));
  }, 400);
}
const saveConfig = save;
const saveMonth = save;
let toastT = null;
function setStatus(t){ const s = $("#status"); s.textContent = t; clearTimeout(toastT); if (!t) { s.classList.remove("show"); return; } s.classList.add("show"); toastT = setTimeout(() => s.classList.remove("show"), 2400); }
function applyData(d){
  config = Object.assign({}, EMPTY, (d && d.config) || {});
  config.fijos = Array.isArray(config.fijos) ? config.fijos : [];
  config.deudas = Array.isArray(config.deudas) ? config.deudas : [];
  config.fijos.forEach(f => { if (!f.id) f.id = uid(); });
  config.deudas.forEach(d => { if (!d.id) d.id = uid(); });
  for (const k in movs) delete movs[k];
  if (d && d.movs && typeof d.movs === "object") for (const k in d.movs) if (/^\d{4}-\d{2}$/.test(k) && Array.isArray(d.movs[k])) movs[k] = d.movs[k];
}
async function loadMonth(k){ if (!movs[k]) movs[k] = []; }

// ---------- calculations ----------
const tasaDe = d => (d.tasaEA == null || d.tasaEA === "" ? config.tasaSupuesta : +d.tasaEA);
const mensual = ea => Math.pow(1 + ea/100, 1/12) - 1;
const cuotaMes = d => d.saldo <= 0 ? 0 : (d.pagoUnico ? d.saldo : Math.min(d.cuota, d.saldo));
const hoy = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const pagadoRef = (list, ref) => list.filter(m => m.ref === ref).reduce((a,m) => a + m.valor, 0);
function objetivoDeuda(d, list){
  const pag = pagadoRef(list, "deuda:"+d.id);
  const obj = d.pagoUnico ? d.saldo + pag : Math.min(+d.cuota||0, d.saldo + pag);
  return {pag, obj, falta: Math.max(0, obj - pag)};
}
function resumenMes(k){
  const list = movs[k] || [];
  const entradas = list.filter(m => m.tipo === "ingreso").reduce((a,m) => a + m.valor, 0);
  const salidas = list.filter(m => m.tipo === "gasto").reduce((a,m) => a + m.valor, 0);
  const sueldoReg = list.some(m => m.tipo === "ingreso" && m.categoria === "Salario");
  const porRecibir = sueldoReg ? 0 : (+config.ingreso||0);
  const pendFijos = config.fijos.filter(f => !list.some(m => m.ref === "fijo:"+f.id)).reduce((a,f) => a + (+f.valor||0), 0);
  const pendDeudas = config.deudas.reduce((a,d) => a + objetivoDeuda(d, list).falta, 0);
  const metaAhorro = (+config.ingreso||0) * (+config.ahorroPct||0) / 100;
  const ahorrado = list.filter(m => m.tipo === "gasto" && m.categoria === "Ahorro").reduce((a,m) => a + m.valor, 0);
  const pendAhorro = Math.max(0, metaAhorro - ahorrado);
  const disponible = entradas - salidas;
  const porPagar = pendFijos + pendDeudas + pendAhorro;
  const libre = disponible + porRecibir - porPagar;
  const varGastos = list.filter(m => m.tipo === "gasto" && !NO_VAR.has(m.categoria));
  const gastado = varGastos.reduce((a,m) => a + m.valor, 0);
  const porCat = {};
  varGastos.forEach(m => porCat[m.categoria] = (porCat[m.categoria]||0) + m.valor);
  return {entradas, salidas, disponible, porRecibir, pendFijos, pendDeudas, pendAhorro, porPagar, libre, gastado, porCat, sueldoReg};
}

function simular(metodo, extra){
  // pagoUnico debts are paid in month 1; then a fixed budget (sum of regular minimums + extra) rolls over.
  let ds = config.deudas.filter(d => d.saldo > 0).map(d => ({...d, bal:+d.saldo, r: mensual(tasaDe(d)), fin:null, interes:0}));
  const presupuesto = ds.filter(d => !d.pagoUnico).reduce((a,d) => a + (+d.cuota||0), 0) + (metodo === "minimos" ? 0 : extra);
  let mes = 0, totalInt = 0; const serie = [ds.reduce((a,d) => a + d.bal, 0)];
  while (ds.some(d => d.bal > 0.5) && mes < 360){
    mes++;
    ds.forEach(d => { if (d.bal > 0){ const i = d.bal * d.r; d.bal += i; d.interes += i; totalInt += i; } });
    // one-off debts
    ds.forEach(d => { if (d.pagoUnico && d.bal > 0){ d.bal = 0; d.fin = mes; } });
    let disp = presupuesto;
    const activas = ds.filter(d => d.bal > 0.5 && !d.pagoUnico);
    if (metodo === "minimos"){
      activas.forEach(d => { const p = Math.min(+d.cuota||0, d.bal); d.bal -= p; });
    } else {
      activas.forEach(d => { const p = Math.min(+d.cuota||0, d.bal, disp); d.bal -= p; disp -= p; });
      const orden = activas.filter(d => d.bal > 0.5).sort(metodo === "avalancha" ? (a,b) => b.r - a.r || a.bal - b.bal : (a,b) => a.bal - b.bal || b.r - a.r);
      for (const d of orden){ if (disp <= 0) break; const p = Math.min(disp, d.bal); d.bal -= p; disp -= p; }
    }
    ds.forEach(d => { if (d.bal <= 0.5 && d.fin == null){ d.bal = 0; d.fin = mes; } });
    serie.push(ds.reduce((a,d) => a + d.bal, 0));
    if (mes > 2 && serie[mes] >= serie[mes-1] && metodo === "minimos" && serie[mes] > serie[0]) break;
  }
  const libre = !ds.some(d => d.bal > 0.5);
  return {meses: libre ? mes : null, interes: totalInt, deudas: ds, serie};
}

  const c = el("div",{class:"card"}, el("h2",{text:"Gastos fijos mensuales"}));
  config.fijos.forEach(f => {
    const n = el("input",{value:f.nombre}); n.addEventListener("change",() => { f.nombre = n.value; saveConfig(); });
    c.append(el("div",{class:"row"}, el("div",{style:"flex:1"},n), el("div",{style:"width:150px"},money(f,"valor")),
      el("button",{class:"ghost","aria-label":"Quitar",title:"Quitar",text:"✕",onclick:() => { config.fijos = config.fijos.filter(x => x !== f); saveConfig(); render(); }})));
  });
  const tot = config.fijos.reduce((a,f) => a + (+f.valor||0), 0);
  c.append(el("div",{class:"row"}, el("strong",{text:"Total"}), el("strong",{class:"num",text:fmt(tot)})));
  c.append(el("button",{style:"margin-top:8px",text:"+ Agregar gasto fijo",onclick:() => { config.fijos.push({nombre:"Nuevo",valor:0}); saveConfig(); render(); }}));
  c.append(el("p",{class:"small muted",text:"Pon aquí lo que pagas sí o sí cada mes. Si el mercado o el transporte son más o menos fijos, agrégalos también: así el límite es más real."}));
  v.append(c);

  // install
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if (!standalone) v.append(el("div",{class:"card"}, el("h2",{text:"Instalar en el celular"}),
    installEvt ? el("button",{class:"pri",text:"Instalar app",onclick:async () => { installEvt.prompt(); await installEvt.userChoice.catch(()=>{}); installEvt = null; render(); }})
      : el("p",{class:"small muted",text:"En Chrome: menú ⋮ → “Instalar app” o “Agregar a la pantalla principal”. En iPhone (Safari): botón Compartir → “Agregar a pantalla de inicio”."})));

  // backup
  const fileIn = el("input",{type:"file",accept:".json,application/json",class:"vh"});
  const bmsg = el("p",{class:"small"});
  fileIn.addEventListener("change", async () => {
    const f = fileIn.files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (!d || !d.config) throw 0;
      applyData(d); await writeNow(); bmsg.textContent = ""; tab = "resumen"; await goMonth(cur);
      setStatus("Respaldo cargado");
    } catch(e){ bmsg.textContent = "Ese archivo no es un respaldo válido de Mis finanzas."; }
  });
  v.append(el("div",{class:"card"}, el("h2",{text:"Respaldo"}),
    el("p",{class:"small muted",text:"Tus datos viven solo en este celular. Descarga un respaldo cada mes: si cambias de celular o borras el navegador, lo cargas y queda todo como estaba. También me lo puedes mandar a Claude para que analice tu mes."}),
    el("div",{style:"display:flex;gap:8px;flex-wrap:wrap"},
      el("button",{class:"pri",text:"Descargar respaldo",onclick:() => {
        const a = el("a",{href:URL.createObjectURL(new Blob([snapshot()],{type:"application/json"})),download:"finanzas-respaldo-"+new Date().toISOString().slice(0,10)+".json"});
        document.body.append(a); a.click(); a.remove(); }}),
      el("label",{class:"btnlike"}, "Cargar respaldo", fileIn)),
    bmsg));
}

// ---------- wiring ----------
function irA(t){ if (tab === t) return; tab = t; render(); window.scrollTo({top:0}); }
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button[data-t]"); if (b) irA(b.dataset.t); });
$("#gear").addEventListener("click", () => irA(tab === "ajustes" ? "resumen" : "ajustes"));
async function goMonth(k){ cur = k; await Promise.all([0,1,2,3,4,5].map(i => loadMonth(addM(k,-i)))); render(); }
$("#prevM").onclick = () => goMonth(addM(cur,-1));
$("#nextM").onclick = () => goMonth(addM(cur,1));
render();

// ----- anotar rápido -----
const CATS_GASTO = ["Mercado","Transporte","Comida fuera / domicilios","Suscripciones","Salud","Ropa y personal","Entretenimiento","Hogar","Regalos","Ahorro","Otros"];
const CATS_ING = ["Ingreso extra","Salario"];
function openQuick(){
  let tipo = "gasto", cat = "Mercado";
  const amt = el("input",{class:"amount num",inputmode:"numeric",placeholder:"$0","aria-label":"Valor"});
  amt.addEventListener("input", () => { const n = Math.round(num(amt.value)); amt.value = n ? "$" + n.toLocaleString("es-CO") : ""; });
  const desc = el("input",{placeholder:"Descripción (opcional): Rappi, bus, D1…"});
  const fecha = el("input",{type:"date",value: cur === mKey(new Date()) ? hoy() : cur+"-01"});
  const chips = el("div",{class:"chips"});
  const seg = el("div",{class:"seg"});
  const preview = el("p",{class:"small muted",style:"text-align:center;margin:0 0 10px"});
  function drawChips(){
    chips.replaceChildren(...(tipo === "gasto" ? CATS_GASTO : CATS_ING).map(c => el("button",{type:"button",class: c === cat ? "on" : "",text:c,onclick:() => { cat = c; drawChips(); }})));
    seg.replaceChildren(
      el("button",{type:"button",class: tipo==="gasto"?"on":"",text:"− Gasto",onclick:() => { tipo = "gasto"; cat = "Mercado"; drawChips(); upd(); }}),
      el("button",{type:"button",class: tipo==="ingreso"?"on":"",text:"+ Ingreso",onclick:() => { tipo = "ingreso"; cat = "Ingreso extra"; drawChips(); upd(); }}));
  }
  function upd(){
    const n = num(amt.value), r = resumenMes(cur);
    preview.textContent = n ? "Te quedaría libre: " + fmt(r.libre + (tipo === "gasto" ? -n : n) - (tipo==="ingreso" && cat==="Salario" && !r.sueldoReg ? n : 0)) : "Libre ahora: " + fmt(r.libre);
  }
  amt.addEventListener("input", upd);
  const sheet = el("div",{class:"sheet",onclick:e => { if (e.target === sheet) sheet.remove(); }},
    el("form",{class:"panel",onsubmit:e => { e.preventDefault();
        const n = num(amt.value); if (!n){ amt.focus(); return; }
        agregar([{fecha:fecha.value || hoy(), descripcion: desc.value.trim() || cat, valor:n, tipo, categoria:cat}]);
        sheet.remove(); render();
        setStatus((tipo === "gasto" ? "Gasto" : "Ingreso") + " de " + fmt(n) + " anotado"); }},
      seg, amt, preview, chips, desc, el("div",{style:"height:8px"}), fecha,
      el("div",{style:"display:flex;gap:8px;margin-top:14px"},
        el("button",{type:"button",style:"flex:1",text:"Cancelar",onclick:() => sheet.remove()}),
        el("button",{type:"submit",class:"pri",style:"flex:2",text:"Guardar"}))));
  drawChips(); upd();
  document.body.append(sheet);
  setTimeout(() => amt.focus(), 60);
}
$("#fab").addEventListener("click", () => { if (config) openQuick(); });

// ----- lock, install, offline -----
function showLock(stored){
  const lock = $("#lock"); lock.classList.remove("hide");
  const inp = $("#pinIn"); setTimeout(() => inp.focus(), 50);
  $("#lockForm").onsubmit = async e => {
    e.preventDefault();
    $("#lockMsg").textContent = "";
    try {
      const salt = unb64(stored.salt);
      const key = await deriveKey(inp.value, salt);
      const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(stored.iv)}, key, unb64(stored.ct));
      applyData(JSON.parse(dec.decode(pt)));
      pinKey = null; pinSalt = null; await writeNow(); // el PIN ya no se usa: deja los datos sin cifrar
      inp.value = ""; lock.classList.add("hide");
            await goMonth(cur);
    } catch(err){ $("#lockMsg").textContent = "PIN incorrecto."; inp.value = ""; }
  };
}
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (pinKey && hiddenAt && Date.now() - hiddenAt > 60000) location.reload(); // vuelve a pedir el PIN
});
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if (tab === "ajustes") render(); });
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

(function init(){
  let encStored = null, plain = null;
  try { encStored = JSON.parse(localStorage.getItem(K_ENC) || "null"); plain = JSON.parse(localStorage.getItem(K_PLAIN) || "null"); } catch(e){}
  if (encStored && encStored.ct){ config = JSON.parse(JSON.stringify(EMPTY)); setStatus(""); showLock(encStored); return; }
  applyData(plain);
  if (!plain){ tab = "ajustes"; setStatus("Bienvenido. Empieza cargando tu respaldo o escribiendo tus datos."); }
  
  goMonth(cur);
})();
})();
</script>
