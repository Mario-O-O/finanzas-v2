<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis finanzas</title>
<meta name="theme-color" content="#0e0e0e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --black:#0e0e0e;--cream:#f1e9c8;--cream2:#e6ddb7;--terra:#e2855f;--terra2:#cf724d;--yellow:#f4d55a;--lime:#c8e28c;--blue:#aac8ef;
  --bg:var(--black);--ink:#f4f1e6;--muted:#8f8c84;--card:#1b1b1b;--card2:#242424;--line:#2b2b2b;
  --dark:#141414;--white:#f4f1e6;--acc:#f4f1e6;--amb:#f4d55a;--ok:#c8e28c;--red:#ff8f74;--red-soft:#3a2420;
  --r:32px;--nav-h:76px;
}
/* pantallas secundarias en tonos suaves de la paleta */
html[data-screen="movs"]{--bg:#f1e9c8}
html[data-screen="deudas"]{--bg:#f5ddcd}
html[data-screen="plan"]{--bg:#e8eecd}
html[data-screen="ajustes"]{--bg:#e4ebf5}
html[data-screen]:not([data-screen="resumen"]){color-scheme:light;--ink:#141414;--muted:rgba(20,20,20,.55);--card:rgba(255,255,255,.55);--card2:rgba(20,20,20,.06);--line:rgba(20,20,20,.09);
  --acc:#141414;--amb:#8a5f00;--ok:#2f6b2a;--red:#b23a22;--red-soft:#ffd9cf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);transition:background .35s;overscroll-behavior-y:none;overflow-x:hidden}
body{overflow-x:hidden}
body{margin:0;background:var(--bg);transition:background .35s;color:var(--ink);font:15.5px/1.5 "Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:540px;margin:0 auto;padding:0 20px calc(var(--nav-h) + 56px + env(safe-area-inset-bottom))}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* encabezado */
.appbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:calc(22px + env(safe-area-inset-top)) 0 6px}
.title{font-size:44px;line-height:1.02;font-weight:600;letter-spacing:-.03em;white-space:pre-line;margin:6px 0 0}
.subt{font-size:14.5px;color:var(--muted);margin-top:10px;font-weight:500}
.avatar{width:50px;height:50px;border-radius:50%;border:none;background:var(--card2);color:var(--ink);display:grid;place-items:center;padding:0;flex:0 0 auto;transition:transform .3s}
.avatar svg{width:24px;height:24px}
.avatar.on{background:var(--ink);color:var(--bg)}
.avatar .x{display:none}
.avatar.on .g{display:none}
.avatar.on .x{display:block;animation:spin .3s ease}
@keyframes spin{from{transform:rotate(-90deg) scale(.6);opacity:0}to{transform:none;opacity:1}}

/* meses (píldoras con borde) */
.months{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:18px -20px 18px;padding:2px 20px}
.months::-webkit-scrollbar{display:none}
.months button{flex:0 0 auto;height:46px;border-radius:99px;background:transparent;border:1.5px solid var(--line);color:var(--muted);font-size:16px;font-weight:500;padding:0 18px;display:flex;align-items:center;gap:8px;text-transform:capitalize}
html[data-screen="resumen"] .months button{border-color:#3a3a3a}
.months button.on{background:#fff;border-color:#fff;color:#141414;font-weight:500}
.months button.on .count{background:#141414;color:#fff}
.months .count{background:var(--card2);border-radius:99px;font-size:12px;padding:2px 8px;font-weight:500}
.sec{display:flex;justify-content:space-between;align-items:baseline;font-size:22px;font-weight:500;letter-spacing:-.02em;margin:26px 2px 12px}
.sec a{font-size:14px;font-weight:500;color:var(--muted);text-decoration:none;cursor:pointer}

/* menú inferior */
.bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:7;width:min(calc(100% - 28px),500px);
  background:#111;border-radius:99px;padding:7px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;box-shadow:0 14px 34px rgba(0,0,0,.28)}
html[data-screen="resumen"] .bottomnav{background:#242424}
.bottomnav button{border:none;background:none;height:56px;display:grid;place-items:center;color:#cfccc2;padding:0;border-radius:99px}
.bottomnav button .ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;transition:background .25s,color .25s}
.bottomnav button.on .ic{background:var(--white);color:#111}
.bottomnav .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.bottomnav .add .plus{width:52px;height:52px;border-radius:50%;background:var(--yellow);color:#111;display:grid;place-items:center}
.bottomnav .add .plus svg{width:26px;height:26px;stroke-width:2.4}

/* controles */
button{font:inherit;cursor:pointer;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:10px 18px;font-weight:500;transition:transform .08s}
button:active{transform:scale(.96)}
button.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 8px;font-weight:500}
button.small{padding:8px 15px;font-size:14px}
button.soft{background:var(--ink);border-color:var(--ink);color:var(--bg)}
input,select{font:inherit;color:var(--ink);background:var(--card2);border:1.5px solid transparent;border-radius:18px;padding:12px 15px;width:100%;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--ink)}
input[type=date]{color-scheme:inherit}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--muted);font-weight:500}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));align-items:end}

/* superficies */
#view{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:var(--r);padding:20px;margin-bottom:12px}
.card h2{font-size:20px;margin:0 0 12px;font-weight:500;letter-spacing:-.01em}
.muted{color:var(--muted)}.small{font-size:13.5px}
.red{color:var(--red)}.amb{color:var(--amb)}.okc{color:var(--ok)}
.pill{display:inline-block;font-size:12.5px;padding:4px 11px;border-radius:99px;background:var(--card2);color:var(--ink);font-weight:500;white-space:nowrap}
.pill.red{background:var(--red-soft);color:var(--red)}.pill.okp{background:var(--lime);color:#141414}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:13px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:none}
.row .d{color:var(--muted);font-size:13.5px}
.tip{background:var(--card2);border-radius:22px;padding:13px 16px;margin-top:10px;font-size:14.5px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:11px 4px;border-top:1px solid var(--line)}
th{font-weight:500;color:var(--muted);font-size:12.5px;border-top:none}
td.r,th.r{text-align:right}

/* inicio */
.hero{background:var(--cream);color:#141414;border-radius:36px;padding:22px 22px 20px;position:relative;margin-bottom:10px}
.hero .lbl{font-size:16px;font-weight:500}
.hero .big{font-size:48px;font-weight:300;letter-spacing:-.03em;line-height:1;margin:14px 0 12px}
.hero .state{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:500}
.hero .state i{width:10px;height:10px;border-radius:50%}
.hero .circbtn{position:absolute;right:16px;top:16px;width:48px;height:48px;border-radius:50%;background:var(--cream2);border:none;display:grid;place-items:center;padding:0;color:#141414}
.hero .meter{height:6px;border-radius:99px;background:var(--cream2);margin-top:16px;overflow:hidden}
.hero .meter i{display:block;height:100%;background:#141414;border-radius:99px}
.hero .perday{font-size:13.5px;color:rgba(20,20,20,.6);margin-top:8px}
.bento{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.tile{border-radius:34px;padding:18px 14px 14px;color:#141414;min-height:220px;display:flex;flex-direction:column;position:relative}
.tile::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:22px;height:3px;border-radius:99px;background:rgba(20,20,20,.25)}
.tile h3{margin:4px 4px 0;font-size:18px;font-weight:500;line-height:1.1;letter-spacing:-.01em}
.tile.terra{background:var(--terra)}.tile.yellow{background:var(--yellow)}
.task{display:flex;align-items:center;gap:10px;background:var(--terra2);border:none;border-radius:99px;padding:9px 12px;margin-top:8px;color:#141414;text-align:left;width:100%;font-weight:500;font-size:14px}
.task .cb{width:20px;height:20px;border-radius:50%;border:2px solid #141414;flex:0 0 auto;display:grid;place-items:center}
.task.done{opacity:.6}.task.done .t{text-decoration:line-through}
.task.done .cb{background:#141414}
.task.done .cb::after{content:"";width:5px;height:9px;border:solid var(--terra);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .val{font-size:clamp(19px,6.2vw,27px);font-weight:400;letter-spacing:-.03em;margin:auto 4px 2px}
.tile .sub{font-size:13px;margin:0 4px 12px;opacity:.65;font-weight:500}
.tile .gobtn{align-self:flex-end;width:52px;height:52px;border-radius:50%;background:#141414;color:var(--yellow);border:none;display:grid;place-items:center;padding:0}
.wide{background:var(--cream);color:#141414;border-radius:34px;padding:12px 12px 12px 14px;display:flex;align-items:center;gap:14px;margin-top:10px}
.wide .emo{width:54px;height:54px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:24px;flex:0 0 auto}
/* moneda 3D que gira */
.coin{width:40px;height:40px;position:relative;transform-style:preserve-3d;animation:coinspin 2.8s linear infinite}
.coin i{position:absolute;inset:0;border-radius:50%;background:#d98a1c}
.coin .f{display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#ffe7a3 0%,#f7bf45 45%,#e79a22 100%);box-shadow:inset 0 0 0 3px #f0a935,inset 0 0 0 5px #ffd77a}
.coin .f svg{width:20px;height:20px;fill:#f3a62c;stroke:#ffe2a0;stroke-width:1.2;stroke-linejoin:round;filter:drop-shadow(0 1px 0 rgba(160,90,0,.35))}
.coin .b{transform:rotateY(180deg) translateZ(3px)}
.coin .fr{transform:translateZ(3px)}
@keyframes coinspin{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
.coinwrap{perspective:240px;display:grid;place-items:center}
@media (prefers-reduced-motion:reduce){.coin{animation:none}}
.coinvid{overflow:hidden;background:#fff}
.coinvid video{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
html[data-screen="ajustes"] #view{margin-top:26px}
html[data-screen="ajustes"] .card{margin-bottom:14px}
.wide b{display:block;font-size:17px}
.wide span{font-size:13px;color:rgba(20,20,20,.6)}
.wide button{margin-left:auto;background:#141414;color:var(--cream);border-color:#141414}
.list .it{display:flex;align-items:center;gap:14px;padding:12px 2px}
.list .ci{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:500;font-size:15px;color:#141414;flex:0 0 auto}
.list .nm{font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .meta{font-size:13px;color:var(--muted)}
.list .amt{margin-left:auto;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.list .x{border:none;padding:4px 6px;color:var(--muted);font-weight:500}
.day{font-size:13px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:18px 2px 2px}

/* resumen grande de pantallas */
.headline{font-size:32px;line-height:1.1;font-weight:300;letter-spacing:-.02em;margin:8px 2px 8px}
.lead{font-size:15.5px;color:var(--muted);margin:0 2px 18px;font-weight:500}
.chipsum{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chipsum span{background:var(--card2);border-radius:99px;padding:6px 12px;font-size:13.5px;font-weight:500}
.debt{background:var(--card);border-radius:30px;padding:18px 18px 14px;margin-bottom:10px}
.debt .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.debt .nm{font-size:17px;font-weight:500}
.debt .saldo{font-size:30px;font-weight:300;letter-spacing:-.03em;margin:8px 0 2px}
.debt .meta{font-size:13.5px;color:var(--muted)}
.debt .edit{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.order{display:flex;align-items:center;gap:14px;padding:11px 0}
.order .n{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:500;flex:0 0 auto}
.order b{display:block;font-size:16px}
.order span{font-size:13px;color:var(--muted)}

/* panel para anotar */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:8;display:flex;align-items:flex-end;justify-content:center;animation:fadebg .2s}
@keyframes fadebg{from{background:rgba(0,0,0,0)}}
.sheet .panel{background:var(--cream);color:#141414;width:100%;max-width:540px;border-radius:34px 34px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .28s cubic-bezier(.2,.8,.2,1);color-scheme:light}
.sheet .panel::before{content:"";display:block;width:42px;height:5px;border-radius:99px;background:rgba(20,20,20,.2);margin:0 auto 14px}
@keyframes up{from{transform:translateY(100%)}}
.sheet input{background:rgba(20,20,20,.06);color:#141414}
.sheet .preview{color:rgba(20,20,20,.55)!important}
.amount{font-size:52px;font-weight:300;text-align:center;border:none!important;background:transparent!important;padding:4px 0;outline:none!important;letter-spacing:-.04em;color:#141414!important}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 8px;background:#141414;padding:5px;border-radius:99px}
.seg button{border:none;color:#f4f1e6;height:48px}
.seg button.on{background:var(--cream);color:#141414}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 14px}
.chips button{padding:8px 15px;font-size:14.5px;border-color:rgba(20,20,20,.18);color:#141414}
.chips button.on{background:#141414;border-color:#141414;color:var(--cream)}
.sheet button{color:#141414;border-color:rgba(20,20,20,.18)}
.sheet button.pri{background:#141414;color:var(--cream);border-color:#141414}
.sheet .seg button{color:#f4f1e6}.sheet .seg button.on{color:#141414}
.sheet .chips button.on{color:var(--cream)}

.status{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 30px + env(safe-area-inset-bottom));z-index:9;background:var(--yellow);color:#141414;
  font-size:14.5px;font-weight:500;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
.status.show{opacity:1}
.lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:10;padding:20px}
.lock .box{max-width:320px;width:100%;text-align:center}
.lock input{font-size:26px;text-align:center;letter-spacing:.4em;margin:14px 0}
.hide{display:none!important}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.btnlike{display:inline-block;position:relative;cursor:pointer;border:1.5px solid var(--line);border-radius:99px;padding:10px 18px;font-weight:500}
svg text{fill:var(--muted);font:12px "Manrope",system-ui,sans-serif}
</style>
</head>
<body>
<div class="wrap">
  <header class="appbar">
    <div><h1 class="title" id="pageTitle">Mis finanzas</h1><div class="subt" id="subTitle"></div></div>
    <button class="avatar" id="avatar" aria-label="Ajustes"><svg class="i g" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><svg class="i x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </header>
  <div class="months" id="months" role="tablist" aria-label="Mes"></div>
  <main id="view"></main>
</div>
<div class="status" id="status" role="status" aria-live="polite"></div>
<nav class="bottomnav" id="tabs" aria-label="Menú">
  <button data-t="resumen" class="on" aria-label="Inicio"><span class="ic"><svg class="i" viewBox="0 0 24 24"><path d="M4 10.2 12 4l8 6.2V19a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19z"/><path d="M12 16.5v-2"/></svg></span><span class="lbl">Inicio</span></button>
  <button data-t="movs" aria-label="Movimientos"><span class="ic"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"/></svg></span><span class="lbl">Movimientos</span></button>
  <button class="add" id="fab" aria-label="Anotar gasto o ingreso"><span class="plus"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span></button>
  <button data-t="deudas" aria-label="Deudas"><span class="ic"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="3"/><path d="M3 10h18M7 14.5h4"/></svg></span><span class="lbl">Deudas</span></button>
  <button data-t="plan" aria-label="Plan de deudas"><span class="ic"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 15.5v-3M12 15.5v-7M15.5 15.5v-5"/></svg></span><span class="lbl">Plan</span></button>
</nav>
<div class="lock hide" id="lock">
  <form class="box" id="lockForm">
    <h1>Mis finanzas</h1>
    <p class="muted">Escribe tu PIN</p>
    <input id="pinIn" type="password" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="PIN">
    <button class="pri" style="width:100%" type="submit">Entrar</button>
    <p class="small red" id="lockMsg"></p>
  </form>
</div>

<script>
(function(){
"use strict";
// ---------- helpers ----------
const $ = s => document.querySelector(s);
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "style") e.setAttribute("style", v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()){ if (c == null || c === false) continue; e.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  return e;
}
const fmt = n => (n < 0 ? "−" : "") + "$" + Math.round(Math.abs(n)).toLocaleString("es-CO");
const num = v => { if (typeof v === "number") return v; const s = String(v||"").replace(/[^\d,.-]/g,"").replace(/\./g,"").replace(",","."); const n = parseFloat(s); return isFinite(n) ? n : 0; };
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const mKey = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
const mName = k => { const [y,m] = k.split("-"); return MESES[+m-1] + " " + y; };

const pad2 = n => String(n).padStart(2,"0");
const diaPagoCfg = () => Math.min(28, Math.max(1, Math.round(+((typeof config !== "undefined" && config && config.diaPago) || 25))));
function periodo(fecha){ // "YYYY-MM-DD" -> clave del periodo "YYYY-MM" (mes en que empieza)
  const y = +fecha.slice(0,4), m = +fecha.slice(5,7), d = +fecha.slice(8,10);
  if (d >= diaPagoCfg()) return y + "-" + pad2(m);
  const p = new Date(y, m-2, 1); return p.getFullYear() + "-" + pad2(p.getMonth()+1);
}
function inicioPeriodo(k){ return k + "-" + pad2(diaPagoCfg()); }
function finPeriodo(k){ const [y,m] = k.split("-").map(Number); const d = new Date(y, m, diaPagoCfg() - 1); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function nombrePeriodo(k, corto){
  const [y,m] = k.split("-").map(Number), dp = diaPagoCfg();
  if (dp === 1) return corto ? MESES[m-1].slice(0,3) : MESES[m-1] + " " + y;
  const sig = new Date(y, m, 1), m2 = sig.getMonth();
  return corto ? MESES[m-1].slice(0,3) + " – " + MESES[m2].slice(0,3) : dp + " " + MESES[m-1].slice(0,3) + " – " + (dp-1) + " " + MESES[m2].slice(0,3);
}

const fechaDefecto = k => k === periodoHoy() ? hoyStr() : inicioPeriodo(k);

  for (const k in movs) delete movs[k];
  todos.forEach(m => { const k = periodo(m.fecha || hoyStr()); (movs[k] = movs[k] || []).push(m); });
}

const K_PLAIN = "finanzas:datos", K_ENC = "finanzas:cifrado";

const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pin, salt){
  const base = await crypto.subtle.importKey("raw", enc.encode(pin), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:200000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}

// copia interna extra en IndexedDB (por si el navegador borra localStorage)
function idbOpen(){ return new Promise((res, rej) => { try { const r = indexedDB.open("finanzas", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch(e){ rej(e); } }); }
async function idbSet(k, v){ const db = await idbOpen(); return new Promise((res, rej) => { const tx = db.transaction("kv","readwrite"); tx.objectStore("kv").put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
async function idbGet(k){ const db = await idbOpen(); return new Promise((res, rej) => { const rq = db.transaction("kv").objectStore("kv").get(k); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); }); }
async function writeNow(){
  const json = snapshot();
  const ahora = new Date().toISOString();
  try { localStorage.setItem("finanzas:guardado", ahora); } catch(e){}
  idbSet("datos", {json, ahora}).catch(() => {});
  if (pinKey){
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, pinKey, enc.encode(json));
    localStorage.setItem(K_ENC, JSON.stringify({salt:b64(pinSalt), iv:b64(iv), ct:b64(ct)}));
    localStorage.removeItem(K_PLAIN);
  } else {
    localStorage.setItem(K_PLAIN, json);
    localStorage.removeItem(K_ENC);
  }
}

// ---------- calculations ----------
const tasaDe = d => (d.tasaEA == null || d.tasaEA === "" ? config.tasaSupuesta : +d.tasaEA);
const mensual = ea => Math.pow(1 + ea/100, 1/12) - 1;
const cuotaMes = d => d.saldo <= 0 ? 0 : (d.pagoUnico ? d.saldo : Math.min(d.cuota, d.saldo));
const hoy = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const pagadoRef = (list, ref) => list.filter(m => m.ref === ref).reduce((a,m) => a + m.valor, 0);
function objetivoDeuda(d, list){
  const pag = pagadoRef(list, "deuda:"+d.id);
  const obj = d.pagoUnico ? d.saldo + pag : Math.min(+d.cuota||0, d.saldo + pag);
  return {pag, obj, falta: Math.max(0, obj - pag)};
}
function resumenMes(k){
  const list = movs[k] || [];
  const entradas = list.filter(m => m.tipo === "ingreso").reduce((a,m) => a + m.valor, 0);
  const salidas = list.filter(m => m.tipo === "gasto").reduce((a,m) => a + m.valor, 0);
  const sueldoReg = list.some(m => m.tipo === "ingreso" && m.categoria === "Salario");
  const porRecibir = sueldoReg ? 0 : (+config.ingreso||0);
  const pendFijos = config.fijos.filter(f => !list.some(m => m.ref === "fijo:"+f.id)).reduce((a,f) => a + (+f.valor||0), 0);
  const pendDeudas = config.deudas.reduce((a,d) => a + objetivoDeuda(d, list).falta, 0);
  const metaAhorro = (+config.ingreso||0) * (+config.ahorroPct||0) / 100;
  const ahorrado = list.filter(m => m.tipo === "gasto" && m.categoria === "Ahorro").reduce((a,m) => a + m.valor, 0);
  const pendAhorro = Math.max(0, metaAhorro - ahorrado);
  const disponible = entradas - salidas;
  const porPagar = pendFijos + pendDeudas + pendAhorro;
  const libre = disponible + porRecibir - porPagar;
  const varGastos = list.filter(m => m.tipo === "gasto" && !NO_VAR.has(m.categoria));
  const gastado = varGastos.reduce((a,m) => a + m.valor, 0);
  const porCat = {};
  varGastos.forEach(m => porCat[m.categoria] = (porCat[m.categoria]||0) + m.valor);
  return {entradas, salidas, disponible, porRecibir, pendFijos, pendDeudas, pendAhorro, porPagar, libre, gastado, porCat, sueldoReg};
}

function simular(metodo, extra){
  // pagoUnico debts are paid in month 1; then a fixed budget (sum of regular minimums + extra) rolls over.
  let ds = config.deudas.filter(d => d.saldo > 0).map(d => ({...d, bal:+d.saldo, r: mensual(tasaDe(d)), fin:null, interes:0}));
  const presupuesto = ds.filter(d => !d.pagoUnico).reduce((a,d) => a + (+d.cuota||0), 0) + (metodo === "minimos" ? 0 : extra);
  let mes = 0, totalInt = 0; const serie = [ds.reduce((a,d) => a + d.bal, 0)];
  while (ds.some(d => d.bal > 0.5) && mes < 360){
    mes++;
    ds.forEach(d => { if (d.bal > 0){ const i = d.bal * d.r; d.bal += i; d.interes += i; totalInt += i; } });
    // one-off debts
    ds.forEach(d => { if (d.pagoUnico && d.bal > 0){ d.bal = 0; d.fin = mes; } });
    let disp = presupuesto;
    const activas = ds.filter(d => d.bal > 0.5 && !d.pagoUnico);
    if (metodo === "minimos"){
      activas.forEach(d => { const p = Math.min(+d.cuota||0, d.bal); d.bal -= p; });
    } else {
      activas.forEach(d => { const p = Math.min(+d.cuota||0, d.bal, disp); d.bal -= p; disp -= p; });
      const orden = activas.filter(d => d.bal > 0.5).sort(metodo === "avalancha" ? (a,b) => b.r - a.r || a.bal - b.bal : (a,b) => a.bal - b.bal || b.r - a.r);
      for (const d of orden){ if (disp <= 0) break; const p = Math.min(disp, d.bal); d.bal -= p; disp -= p; }
    }
    ds.forEach(d => { if (d.bal <= 0.5 && d.fin == null){ d.bal = 0; d.fin = mes; } });
    serie.push(ds.reduce((a,d) => a + d.bal, 0));
    if (mes > 2 && serie[mes] >= serie[mes-1] && metodo === "minimos" && serie[mes] > serie[0]) break;
  }
  const libre = !ds.some(d => d.bal > 0.5);
  return {meses: libre ? mes : null, interes: totalInt, deudas: ds, serie};
}

function vResumen(v){
  const r = resumenMes(cur);
  const list = movs[cur] || [];
  const presupuesto = r.gastado + r.libre;
  const pct = presupuesto > 0 ? Math.min(100, r.gastado / presupuesto * 100) : 100;
  const esActual = cur === periodoHoy();
  const dIni = new Date(inicioPeriodo(cur)+"T00:00"), dFin = new Date(finPeriodo(cur)+"T00:00"), dHoy = new Date(hoyStr()+"T00:00");
  const diasPer = Math.round((dFin - dIni)/864e5) + 1;

        const a = el("a",{href:URL.createObjectURL(new Blob([snapshot()],{type:"application/json"})),download:"finanzas-respaldo-"+new Date().toISOString().slice(0,10)+".json"});
        document.body.append(a); a.click(); a.remove(); }}),
      el("label",{class:"btnlike"}, "Cargar respaldo", fileIn)),
    bmsg));
}

// ---------- wiring ----------
function irA(t){ if (tab === t) return; tab = t; render(); window.scrollTo({top:0}); }
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button[data-t]"); if (b) irA(b.dataset.t); });
$("#avatar").addEventListener("click", () => irA(tab === "ajustes" ? "resumen" : "ajustes"));
async function goMonth(k){ cur = k; await Promise.all([0,1,2,3,4,5].map(i => loadMonth(addM(k,-i)))); render(); }
render();

// ----- anotar rápido -----
const CATS_GASTO = ["Mercado","Transporte","Comida fuera / domicilios","Cerveza","Suscripciones","Salud","Ropa y personal","Entretenimiento","Hogar","Regalos","Ahorro","Otros"];
const CATS_ING = ["Ingreso extra","Salario"];
function openQuick(){
  let tipo = "gasto", cat = "Mercado";
  const amt = el("input",{class:"amount num",inputmode:"numeric",placeholder:"$0","aria-label":"Valor"});
  amt.addEventListener("input", () => { const n = Math.round(num(amt.value)); amt.value = n ? "$" + n.toLocaleString("es-CO") : ""; });
  const desc = el("input",{placeholder:"Descripción (opcional): Rappi, bus, D1…"});
  const fecha = el("input",{type:"date",value: fechaDefecto(cur)});
  const chips = el("div",{class:"chips"});
  const seg = el("div",{class:"seg"});
  const preview = el("p",{class:"small preview",style:"text-align:center;margin:0 0 10px"});
  function drawChips(){
    chips.replaceChildren(...(tipo === "gasto" ? CATS_GASTO : CATS_ING).map(c => el("button",{type:"button",class: c === cat ? "on" : "",text:c,onclick:() => { cat = c; drawChips(); }})));
    seg.replaceChildren(
      el("button",{type:"button",class: tipo==="gasto"?"on":"",text:"− Gasto",onclick:() => { tipo = "gasto"; cat = "Mercado"; drawChips(); upd(); }}),
      el("button",{type:"button",class: tipo==="ingreso"?"on":"",text:"+ Ingreso",onclick:() => { tipo = "ingreso"; cat = "Ingreso extra"; drawChips(); upd(); }}));
  }
  function upd(){
    const n = num(amt.value), r = resumenMes(cur);
    preview.textContent = n ? "Te quedaría libre: " + fmt(r.libre + (tipo === "gasto" ? -n : n) - (tipo==="ingreso" && cat==="Salario" && !r.sueldoReg ? n : 0)) : "Libre ahora: " + fmt(r.libre);
  }
  amt.addEventListener("input", upd);
  const sheet = el("div",{class:"sheet",onclick:e => { if (e.target === sheet) sheet.remove(); }},
    el("form",{class:"panel",onsubmit:e => { e.preventDefault();
        const n = num(amt.value); if (!n){ amt.focus(); return; }
        agregar([{fecha:fecha.value || hoy(), descripcion: desc.value.trim() || cat, valor:n, tipo, categoria:cat}]);
        sheet.remove(); render();
        setStatus((tipo === "gasto" ? "Gasto" : "Ingreso") + " de " + fmt(n) + " anotado"); }},
      seg, amt, preview, chips, desc, el("div",{style:"height:8px"}), fecha,
      el("div",{style:"display:flex;gap:8px;margin-top:14px"},
        el("button",{type:"button",style:"flex:1",text:"Cancelar",onclick:() => sheet.remove()}),
        el("button",{type:"submit",class:"pri",style:"flex:2",text:"Guardar"}))));
  drawChips(); upd();
  document.body.append(sheet); setBarras("#0b0b0b");
  new MutationObserver((_, obs) => { if (!sheet.isConnected){ setBarras(); obs.disconnect(); } }).observe(document.body, {childList:true});
  setTimeout(() => amt.focus(), 60);
}
$("#fab").addEventListener("click", () => { if (config) openQuick(); });

// ----- lock, install, offline -----
function showLock(stored){
  const lock = $("#lock"); lock.classList.remove("hide");
  const inp = $("#pinIn"); setTimeout(() => inp.focus(), 50);
  $("#lockForm").onsubmit = async e => {
    e.preventDefault();
    $("#lockMsg").textContent = "";
    try {
      const salt = unb64(stored.salt);
      const key = await deriveKey(inp.value, salt);
      const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(stored.iv)}, key, unb64(stored.ct));
      applyData(JSON.parse(dec.decode(pt)));
      pinKey = null; pinSalt = null; await writeNow(); // el PIN ya no se usa: deja los datos sin cifrar
      inp.value = ""; lock.classList.add("hide");
            await goMonth(cur);
    } catch(err){ $("#lockMsg").textContent = "PIN incorrecto."; inp.value = ""; }
  };
}
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (pinKey && hiddenAt && Date.now() - hiddenAt > 60000) location.reload(); // vuelve a pedir el PIN
});
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if (tab === "ajustes") render(); });
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

try { if (!sessionStorage.getItem("finanzas:origen")) sessionStorage.setItem("finanzas:origen", document.referrer || "-"); } catch(e){}
(async function init(){
  let encStored = null, plain = null, recuperado = false;
  try { encStored = JSON.parse(localStorage.getItem(K_ENC) || "null"); plain = JSON.parse(localStorage.getItem(K_PLAIN) || "null"); } catch(e){}
  if (encStored && encStored.ct){ config = JSON.parse(JSON.stringify(EMPTY)); setStatus(""); showLock(encStored); return; }
  if (!plain){ // intenta la copia interna
    try { const r = await idbGet("datos"); if (r && r.json){ plain = JSON.parse(r.json); recuperado = true; try { localStorage.setItem("finanzas:guardado", r.ahora); } catch(e){} } } catch(e){}
  }
  applyData(plain);
  if (recuperado){ try { localStorage.setItem(K_PLAIN, snapshot()); } catch(e){} setStatus("Datos recuperados de la copia interna"); }
  if (!plain){ tab = "ajustes"; setStatus("Bienvenido. Empieza cargando tu respaldo o escribiendo tus datos."); }
  goMonth(cur);
})();
})();
</script>
